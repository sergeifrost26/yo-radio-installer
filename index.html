<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ё Radio ESP32-S3 Installer</title>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js?module">
  </script>

  <style>
    body{
      margin:0;
      background:#0f172a;
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .card{
      width:420px;
      background:#1e293b;
      border-radius:24px;
      padding:40px;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    h1{
      margin-top:0;
      font-size:36px;
    }

    p{
      color:#cbd5e1;
      line-height:1.6;
    }

    .steps{
      text-align:left;
      margin-top:30px;
      background:#0f172a;
      padding:20px;
      border-radius:16px;
    }

    .steps li{
      margin-bottom:10px;
    }

    button{
      background:#22c55e;
      border:none;
      color:white;
      font-size:20px;
      padding:18px 32px;
      border-radius:16px;
      cursor:pointer;
      margin-top:25px;
      font-weight:bold;
    }

    button:hover{
      background:#16a34a;
    }

    .footer{
      margin-top:30px;
      color:#94a3b8;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Ё Radio</h1>

  <p>
    Онлайн-прошивка ESP32-S3 через браузер Chrome
  </p>

  <esp-web-install-button manifest="manifest.json">
    <button slot="activate">
      ПРОШИТЬ ESP32-S3
    </button>
  </esp-web-install-button>

  <div class="steps">
    <ol>
      <li>Подключите ESP32-S3 через USB</li>
      <li>Откройте Google Chrome</li>
      <li>Нажмите кнопку прошивки</li>
      <li>Выберите COM-порт</li>
      <li>Дождитесь окончания установки</li>
    </ol>
  </div>

  <div class="footer">
    YO Radio Installer © 2026
  </div>

</div>

</body>
</html>
